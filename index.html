<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#dde5f1; --cloth:#eaf0f9; --ink:#1c2750; --muted:#465180; --thread:#c9461d; --btn-ink:#fff;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121936; --cloth:#1b2449; --ink:#eef1fa; --muted:#a9b3d6; --thread:#f4b63f; --btn-ink:#121936}
}
:root[data-theme="dark"]{--bg:#121936; --cloth:#1b2449; --ink:#eef1fa; --muted:#a9b3d6; --thread:#f4b63f; --btn-ink:#121936}

*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg) repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink) 5%,transparent) 0 1px,transparent 1px 5px);color:var(--ink);font:400 1rem/1.75 var(--sans)}
.hand{font-family:var(--hand);font-weight:700}

/* Cover */
.cover{min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;place-items:center;padding:24px}
.patch{position:relative;width:100%;max-width:340px;padding:44px 28px 36px;text-align:center;background:var(--cloth);border-radius:14px}
.patch::before{content:"";position:absolute;inset:9px;border:2px dashed var(--ink);opacity:.5;border-radius:8px;pointer-events:none}
.patch::after{content:"";position:absolute;top:-15px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.25);background:radial-gradient(circle at 38% 38%,var(--cloth) 0 2px,transparent 2.5px),radial-gradient(circle at 62% 38%,var(--cloth) 0 2px,transparent 2.5px),radial-gradient(circle at 38% 62%,var(--cloth) 0 2px,transparent 2.5px),radial-gradient(circle at 62% 62%,var(--cloth) 0 2px,transparent 2.5px),var(--thread)}
.patch p{margin:0}
.to{color:var(--muted)}
.who{font-size:clamp(3rem,16vw,4.4rem);line-height:1.05;color:var(--thread);margin:6px 0 28px!important;overflow-wrap:anywhere}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 26px;border:0;border-radius:999px;background:var(--thread);color:var(--btn-ink);font:500 1rem/1.2 var(--sans);text-decoration:none;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn svg{width:18px;height:18px;fill:currentColor}

/* Câu đố + sợi chỉ */
.patch .q{margin:0 0 14px;font-weight:500}
.ans{width:100%;min-height:48px;padding:10px 14px;border:2px dashed var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);font:500 1.2rem/1.2 var(--sans);text-align:center;letter-spacing:.06em}
.ans:focus-visible{outline:3px solid var(--thread);outline-offset:2px}
.patch .help{margin:8px 0 0;font-size:.85rem;color:var(--muted)}
.patch .msg{min-height:3.2em;margin:10px 0 8px;font-size:.92rem;color:var(--ink)}
.skip{display:block;margin:6px auto 0;min-height:44px;padding:10px 8px;border:0;background:none;color:var(--muted);font:inherit;font-size:.88rem;text-decoration:underline;cursor:pointer}
.patch .ok{margin:0;font-weight:500}
.thread-track{position:relative;width:100%;height:230px;margin:6px auto 0}
#tc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.knot{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;border-radius:50%;background:transparent;cursor:grab;touch-action:none}
.knot:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.thread-track.drag .knot{cursor:grabbing}

/* Main */
.wrap{max-width:560px;margin:0 auto;padding:44px 24px 72px}
main.show{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{margin:0;font-size:clamp(2.5rem,10.5vw,3.6rem);line-height:1.05}
.name{margin:4px 0 0;font-size:clamp(3.4rem,15vw,5.4rem);line-height:1;color:var(--thread);overflow-wrap:anywhere}
.thread{display:block;width:300px;max-width:100%;height:auto;margin:6px 0 30px}
.rv{stroke-dasharray:1;stroke-dashoffset:1}
main.show .rv{animation:draw 1.8s ease .4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.wish{font-size:1.06rem;margin:0}
hr{border:0;border-top:2px dashed var(--ink);opacity:.3;margin:40px 0}
h2{margin:0 0 8px;font-size:1.15rem;font-weight:500}
.story{margin:0 0 26px;color:var(--muted)}
.sign{margin:48px 0 0;text-align:right;font-size:2.1rem;line-height:1.2}

/* Photos */
.photo{margin:0}
.photo img{display:block;width:100%;height:auto;border-radius:6px}
.ph{display:grid;place-items:center;aspect-ratio:4/3;padding:12px;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.4;border:2px dashed var(--muted);border-radius:6px;overflow-wrap:anywhere}
.photo figcaption{margin-top:10px;text-align:center;color:var(--muted);font-size:1.4rem;line-height:1.25;white-space:pre-line}
.moment{position:relative;padding:12px 12px 10px;background:var(--cloth);border-radius:12px}
.moment::before{content:"";position:absolute;inset:5px;border:2px dashed var(--ink);opacity:.35;border-radius:8px;pointer-events:none}
.moment img{max-height:72svh;object-fit:cover}
.together{margin:36px 0 0;transform:rotate(-1.2deg)}
.gift-photo{margin:0 0 26px}
.gift-photo img{max-height:60svh;object-fit:cover}
.gift-photo .ph{aspect-ratio:16/10}

/* Trang trí */
.moment::after{content:"";position:absolute;top:-13px;left:50%;width:92px;height:26px;margin-left:-46px;background:var(--thread);opacity:.7;transform:rotate(-3deg);clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%)}
.cut{position:relative;margin:44px 0;border-top:2px dashed var(--ink);opacity:.4}
.cut::after{content:"\2702\FE0E";position:absolute;left:14%;top:-.8em;padding:0 .5em;background:var(--bg);font-size:1.15rem;line-height:1}
.sp{position:fixed;top:0;left:max(9px,env(safe-area-inset-left,0px));width:3px;height:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--thread) 0 9px,transparent 9px 16px)}
.sp::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--thread)}
.rise{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rise.in{opacity:1;transform:none}
.cake-wrap{margin:30px 0 8px;text-align:center}
.cake{display:block;width:min(230px,70%);margin:0 auto;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cake svg{display:block;width:100%;height:auto;overflow:visible}
.cake:focus-visible{outline:3px solid var(--ink);outline-offset:6px;border-radius:12px}
.fl{transform-box:fill-box;transform-origin:50% 100%;transition:opacity .35s,transform .35s;animation:flick 1.1s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.92) rotate(-3deg)}to{transform:scaleY(1.1) rotate(3deg)}}
.cake.out .fl{opacity:0;transform:scale(.2);animation:none}
.cake-note{margin:6px 0 0;font-size:1.5rem;line-height:1.2;color:var(--muted)}

#fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}

@media (prefers-reduced-motion:reduce){
  main.show{animation:none}
  .thread-track:not(.drag) .tline,.thread-track:not(.drag) .knot{transition:none}
  .rv,main.show .rv{animation:none;stroke-dashoffset:0}
  .fl{animation:none}
}
</style>
</head>
<body>

<section class="cover" id="cover">
  <div class="patch">
    <p class="to">Có một món quà dành cho</p>
    <p class="who hand" id="coverName"></p>
    <div id="quiz">
      <p class="q" id="qText"></p>
      <input class="ans" id="ans" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="go" aria-labelledby="qText" aria-describedby="qHelp qMsg">
      <p class="help" id="qHelp"></p>
      <p class="msg" id="qMsg" role="status" aria-live="polite"></p>
      <button class="btn" id="check" type="button">Kiểm tra</button>
      <button class="skip" id="skip" type="button" hidden>Mình quên rồi, cho mình vào</button>
    </div>

    <div id="pull" hidden>
      <p class="ok" id="pullMsg"></p>
      <div class="thread-track" id="track">
        <canvas id="tc" aria-hidden="true"></canvas>
        <button class="knot" id="knot" type="button" aria-label="Kéo sợi chỉ xuống để mở quà"></button>
      </div>
    </div>
  </div>
</section>

<main id="main" hidden>
  <div class="sp" id="sp" aria-hidden="true"></div>
  <div class="wrap">
    <h1 class="hand">Chúc mừng sinh nhật</h1>
    <p class="name hand" id="name"></p>
    <svg class="thread" viewBox="0 0 300 20" aria-hidden="true">
      <defs>
        <mask id="rev">
          <path class="rv" d="M4 12 C 40 2, 70 22, 110 12 S 190 2, 230 12 S 280 20, 296 10" pathLength="1" fill="none" stroke="#fff" stroke-width="10"/>
        </mask>
      </defs>
      <path d="M4 12 C 40 2, 70 22, 110 12 S 190 2, 230 12 S 280 20, 296 10" fill="none" style="stroke:var(--thread)" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8" mask="url(#rev)"/>
    </svg>

    <div class="cake-wrap">
      <button class="cake" id="cake" type="button" aria-pressed="false" aria-label="Thổi nến">
        <svg viewBox="0 0 200 165" aria-hidden="true">
          <ellipse cx="100" cy="152" rx="88" ry="9" style="fill:var(--ink)" opacity=".18"/>
          <g stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round" style="stroke:var(--ink)">
            <rect x="26" y="98" width="148" height="50" rx="10" style="fill:var(--cloth)"/>
            <rect x="52" y="62" width="96" height="38" rx="10" style="fill:var(--cloth)"/>
          </g>
          <path d="M52 74Q52 62 64 62H136Q148 62 148 74V78Q142 90 135 78Q128 92 120 78Q112 90 104 78Q96 92 88 78Q80 90 73 78Q66 90 59 78Q52 82 52 78Z" style="fill:var(--thread)"/>
          <path d="M26 112q12 14 24 0t24 0t24 0t24 0t24 0t24 0" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--thread)"/>
          <g style="fill:var(--ink)"><rect x="77" y="36" width="6" height="28" rx="2"/><rect x="97" y="36" width="6" height="28" rx="2"/><rect x="117" y="36" width="6" height="28" rx="2"/></g>
          <g fill="#f4b63f"><ellipse class="fl" cx="80" cy="27" rx="5" ry="8"/><ellipse class="fl" cx="100" cy="27" rx="5" ry="8" style="animation-delay:-.4s"/><ellipse class="fl" cx="120" cy="27" rx="5" ry="8" style="animation-delay:-.8s"/></g>
        </svg>
      </button>
      <p class="cake-note hand" id="cakeNote">Chạm vào bánh để thổi nến</p>
    </div>

    <p class="wish" id="wish"></p>
    <div id="togetherSlot"></div>

    <div class="cut" aria-hidden="true"></div>

    <h2 id="giftTitle"></h2>
    <p class="story" id="giftStory"></p>
    <div id="giftPhotoSlot"></div>
    <a class="btn" id="video" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      Xem quá trình làm món quà
    </a>

    <p class="sign hand" id="from"></p>
  </div>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
/* ===== Chỉnh nội dung ở đây ===== */
const CONFIG = {
  name: "hng, Nguyễn Hiếu Ngân",
  from: "— Mon",
  wish: "Chúc bé một tuổi mới thật nhiều sức khoẻ, bình yên và những điều vui bất ngờ. Cảm ơn vì đã luôn ở đó. Lớn hơn một chút rồi sau đừng có đánh anh nhé!!!",
  giftTitle: "Quà của bạn đây",
  giftStory: "Mỗi chi tiết của món quà này đều được làm thủ công, từng chút một. Thật ra mình hơi vội vì trễ quá rồi, cái này là mình cũng mới nghĩ ra thôi. Tất cả mọi thứ đều rất vội vã, vì thế nó không được hoàn hảo như mình mong muốn. Nhưng mình vẫn muốn gửi đến bạn món quà này, vì nó là tất cả những gì mình có thể làm cho bạn lúc này. Mong bạn thích nó.( Mình thấy nó cũng đẳng cấp mà)",
  videoUrl: "https://www.youtube.com/watch?v=PdDikt23Ugo",

  /* Câu đố mở quà. Đặt quiz: null để bỏ cổng, chỉ còn kéo sợi chỉ.
     Ngày tháng chấp nhận nhiều kiểu gõ: 02032026, 02/03/2026, 2-3-2026 đều được.
     Đáp án chữ thì không phân biệt hoa thường và dấu. keyboard: "numeric" hoặc "text".
     Sai 2 lần hiện hint, sai 3 lần hiện nút bỏ qua. Đáp án nằm trong code nên chỉ là trò chơi, không phải bảo mật. */
  quiz: {
    question: "Password của chúng ta?",
    answer: "1304",
    keyboard: "numeric",
    help: "Không nhớ là không thương",
    hint: "Ko có gợi ý đâu."
  },

  /* Ảnh: bỏ file vào thư mục images/ cạnh index.html rồi điền src, ví dụ "images/hai-dua.jpg".
     src rỗng "" -> hiện ô trống để biết chỗ chèn. caption xuống dòng bằng \n, để "" thì không hiện.
     Đặt null nếu muốn bỏ hẳn ảnh đó. */
  togetherPhoto: { src: "images/hai-dua.jpg", alt: "Mon n hng", caption: "Lệch" },
  giftPhoto: { src: "", alt: "Bánh kemmmm", caption: "Rất tâm huyết" }
};
/* ================================= */

(function(){
  const $ = id => document.getElementById(id);
  document.title = "Chúc mừng sinh nhật " + CONFIG.name;
  $("coverName").textContent = CONFIG.name;
  $("name").textContent = CONFIG.name + ",";
  $("wish").textContent = CONFIG.wish;
  $("giftTitle").textContent = CONFIG.giftTitle;
  $("giftStory").textContent = CONFIG.giftStory;
  $("from").textContent = CONFIG.from;
  $("video").href = CONFIG.videoUrl;

  function photo(p, extra){
    const f = document.createElement("figure");
    f.className = "photo" + (extra ? " " + extra : "");
    const slot = msg => { const d = document.createElement("div"); d.className = "ph"; d.textContent = msg; return d; };
    if (p.src) {
      const i = new Image();
      i.alt = p.alt || ""; i.loading = "lazy"; i.decoding = "async";
      i.onerror = () => i.replaceWith(slot("Không tải được ảnh: " + p.src));
      i.src = p.src;
      f.append(i);
    } else {
      f.append(slot("Chèn ảnh ở đây"));
    }
    if (p.caption) {
      const c = document.createElement("figcaption");
      c.className = "hand"; c.textContent = p.caption; f.append(c);
    }
    return f;
  }
  if (CONFIG.togetherPhoto) $("togetherSlot").append(photo(CONFIG.togetherPhoto, "moment together"));
  if (CONFIG.giftPhoto) $("giftPhotoSlot").append(photo(CONFIG.giftPhoto, "gift-photo"));

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- Cổng câu đố ----
  const Q = CONFIG.quiz;
  const norm = s => {
    s = String(s).trim();
    if (/^[\d\s\/.\-]+$/.test(s)) {
      const p = s.split(/\D+/).filter(Boolean);
      return p.length === 3 ? p[0].padStart(2, "0") + p[1].padStart(2, "0") + p[2] : p.join("");
    }
    return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/\s+/g, " ");
  };
  const showPull = msg => {
    $("quiz").hidden = true;
    $("pullMsg").textContent = msg;
    $("pull").hidden = false;
    requestAnimationFrame(startThread);
    $("knot").focus({ preventScroll: true });
  };
  if (!Q) {
    showPull("Kéo sợi chỉ xuống để mở quà.");
  } else {
    let tries = 0;
    $("qText").textContent = Q.question;
    $("ans").inputMode = Q.keyboard || "text";
    $("qHelp").textContent = Q.help || "";
    $("qHelp").hidden = !Q.help;
    const check = () => {
      if (!$("ans").value.trim()) return;
      if (norm($("ans").value) === norm(Q.answer)) return showPull("Đúng rồi! Giờ kéo sợi chỉ xuống để mở quà.");
      tries++;
      $("qMsg").textContent = "Vl bạn không thương mình." + (tries >= 2 && Q.hint ? " Gợi ý: " + Q.hint : "");
      if (tries >= 3) $("skip").hidden = false;
      $("ans").select();
    };
    $("check").addEventListener("click", check);
    $("ans").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    $("skip").addEventListener("click", () => showPull("Không sao, kéo sợi chỉ xuống để mở quà nhé."));
  }

  // ---- Sợi chỉ thật: dây mô phỏng vật lý, kéo ra khỏi đường khâu ----
  const track = $("track"), knot = $("knot"), cv2 = $("tc");
  const N = 16, L0 = 92, MAXP = 105, GO = 80, G = .55, ay = 22;
  let pts = [], c2, W2 = 0, H2 = 0, ax = 0, ext = 0, drag = null, raf = 0, done = false, col = "#c9461d";

  const unlock = () => {
    done = true; cancelAnimationFrame(raf);
    if (navigator.vibrate) navigator.vibrate(25);
    $("cover").hidden = true;
    $("main").hidden = false;
    $("main").classList.add("show");
    window.scrollTo(0, 0);
    prog();
    if (!reduce) burst();
  };

  function startThread(){
    if (raf || done) return;
    const d = Math.min(devicePixelRatio || 1, 2), r = track.getBoundingClientRect();
    W2 = r.width; H2 = r.height; cv2.width = W2 * d; cv2.height = H2 * d;
    c2 = cv2.getContext("2d"); c2.scale(d, d);
    col = getComputedStyle(document.documentElement).getPropertyValue("--thread").trim() || col;
    ax = W2 / 2 + 62; ext = 0;
    pts = Array.from({ length: N }, (_, i) => {
      const x = ax + (i / N) ** 2 * 34, y = ay + i * L0 / (N - 1);
      return { x, y, px: x - (i / N) * 1.6, py: y };
    });
    raf = requestAnimationFrame(step);
  }

  function step(ts){
    raf = requestAnimationFrame(step);
    const n = pts.length, e = pts[n - 1];
    if (drag) {
      const dx = drag.x - ax, dy = drag.y - ay, dist = Math.hypot(dx, dy) || 1;
      ext = Math.max(0, Math.min(MAXP, dist - L0));
      const k = Math.min(dist, L0 + ext) / dist;
      e.x = e.px = ax + dx * k; e.y = e.py = ay + dy * k;
    } else ext *= .88;                       // thả tay: sợi chỉ tụt về lại
    const seg = (L0 + ext) / (n - 1), wind = reduce ? 0 : Math.sin(ts / 900) * .035;
    for (let i = 1; i < n; i++) {
      const p = pts[i]; if (drag && i === n - 1) continue;
      const vx = (p.x - p.px) * .985, vy = (p.y - p.py) * .985;
      p.px = p.x; p.py = p.y; p.x += vx + wind * i / n; p.y += vy + G;
    }
    for (let it = 0; it < 10; it++) {
      pts[0].x = ax; pts[0].y = ay;
      for (let i = 0; i < n - 1; i++) {
        const a = pts[i], b = pts[i + 1], dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 1e-4, f = (d - seg) / d;
        const wa = i === 0 ? 0 : (drag && i + 1 === n - 1 ? 1 : .5), wb = 1 - wa - (drag && i + 1 === n - 1 ? 1 - wa : 0);
        a.x += dx * f * wa; a.y += dy * f * wa; b.x -= dx * f * wb; b.y -= dy * f * wb;
      }
    }
    if (ext >= GO) return unlock();
    draw();
  }

  function draw(){
    const n = pts.length, e = pts[n - 1], q = pts[n - 2], t = Math.min(1, ext / GO);
    c2.clearRect(0, 0, W2, H2); c2.lineCap = c2.lineJoin = "round";
    c2.strokeStyle = col; c2.lineWidth = 3.2;                       // đường khâu, bị tháo dần khi kéo
    for (let i = Math.floor(t * 8); i < 7; i++) { const x = ax - 14 - i * 27; c2.beginPath(); c2.moveTo(x - 9, ay); c2.lineTo(x + 9, ay); c2.stroke(); }
    const path = () => {
      c2.beginPath(); c2.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < n - 1; i++) c2.quadraticCurveTo(pts[i].x, pts[i].y, (pts[i].x + pts[i + 1].x) / 2, (pts[i].y + pts[i + 1].y) / 2);
      c2.lineTo(e.x, e.y);
    };
    c2.save(); c2.translate(1.5, 3); c2.strokeStyle = "rgba(0,0,0,.22)"; c2.lineWidth = 3.6; path(); c2.stroke(); c2.restore();
    c2.strokeStyle = col; c2.lineWidth = 3.4; path(); c2.stroke();   // sợi chính
    c2.strokeStyle = "rgba(255,255,255,.5)"; c2.lineWidth = 1.2; c2.setLineDash([2.5, 4]); path(); c2.stroke(); c2.setLineDash([]); // vân xoắn
    const ang = Math.atan2(e.y - q.y, e.x - q.x);                    // hai đầu chỉ thừa ở nút thắt
    c2.strokeStyle = col; c2.lineWidth = 2.4;
    [-.45, .5].forEach((o, j) => {
      const a = ang + o, l = 17 + j * 4; c2.beginPath(); c2.moveTo(e.x, e.y);
      c2.quadraticCurveTo(e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10, e.x + Math.cos(a + o * .6) * l, e.y + Math.sin(a + o * .6) * l); c2.stroke();
    });
    c2.fillStyle = col; c2.beginPath(); c2.arc(e.x, e.y, 9.5, 0, 6.29); c2.fill();   // nút thắt
    const g = c2.createRadialGradient(e.x - 3, e.y - 3, 1, e.x, e.y, 10);
    g.addColorStop(0, "rgba(255,255,255,.5)"); g.addColorStop(1, "rgba(255,255,255,0)");
    c2.fillStyle = g; c2.beginPath(); c2.arc(e.x, e.y, 9.5, 0, 6.29); c2.fill();
    c2.strokeStyle = "rgba(0,0,0,.28)"; c2.lineWidth = 1;
    [[6.2, .4, 2.4], [3.8, 3.4, 5.4]].forEach(([r, a, b]) => { c2.beginPath(); c2.arc(e.x, e.y, r, a, b); c2.stroke(); });
    knot.style.left = e.x + "px"; knot.style.top = e.y + "px";
  }

  const pt = ev => { const r = track.getBoundingClientRect(); return { x: Math.max(12, Math.min(W2 - 12, ev.clientX - r.left)), y: Math.max(ay, Math.min(H2 - 12, ev.clientY - r.top)) }; };
  knot.addEventListener("pointerdown", ev => { knot.setPointerCapture(ev.pointerId); drag = pt(ev); track.classList.add("drag"); startThread(); });
  knot.addEventListener("pointermove", ev => { if (drag) drag = pt(ev); });
  const release = () => { drag = null; track.classList.remove("drag"); };
  knot.addEventListener("pointerup", release);
  knot.addEventListener("pointercancel", release);
  knot.addEventListener("click", ev => { if (ev.detail === 0) unlock(); }); // bàn phím: Enter / Space
  addEventListener("resize", () => { if (raf && !done) { cancelAnimationFrame(raf); raf = 0; startThread(); } });

  // ---- Thổi nến ----
  const cake = $("cake");
  cake.addEventListener("click", () => {
    const out = cake.classList.toggle("out");
    cake.setAttribute("aria-pressed", out);
    $("cakeNote").textContent = out ? "Nhắm mắt, ước một điều đi nhé. Đừng nói ra!" : "Chạm vào bánh để thổi nến";
    if (out) { if (navigator.vibrate) navigator.vibrate(20); if (!reduce) burst(); }
  });

  // ---- Hiện dần khi cuộn + sợi chỉ chạy theo trang ----
  if ("IntersectionObserver" in window && !reduce) {
    const ro = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); ro.unobserve(e.target); }
    }), { threshold: .15 });
    document.querySelectorAll(".cake-wrap,.wish,#togetherSlot,#giftTitle,.story,#giftPhotoSlot,#video,.sign")
      .forEach(el => { el.classList.add("rise"); ro.observe(el); });
  }
  const sp = $("sp");
  const prog = () => {
    const m = document.documentElement.scrollHeight - innerHeight;
    sp.style.height = (m > 0 ? Math.min(100, scrollY / m * 100) : 0) + "vh";
  };
  addEventListener("scroll", prog, { passive: true });
  addEventListener("resize", prog);

  // Confetti = những đường chỉ ngắn
  function burst(){
    const cv = $("fx"), cx = cv.getContext("2d");
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const W = cv.width = innerWidth * d, H = cv.height = innerHeight * d;
    const cs = getComputedStyle(document.documentElement);
    const cols = ["--thread","--ink","--muted"].map(v => cs.getPropertyValue(v).trim());
    const ps = Array.from({length: 90}, () => ({
      x: W / 2, y: H * 0.4,
      vx: (Math.random() - .5) * 14 * d, vy: (-Math.random() * 13 - 3) * d,
      a: Math.random() * 6.28, va: (Math.random() - .5) * .4,
      l: (10 + Math.random() * 12) * d, c: cols[Math.floor(Math.random() * cols.length)]
    }));
    let t = 0;
    (function f(){
      cx.clearRect(0, 0, W, H);
      cx.lineWidth = 3 * d; cx.lineCap = "round";
      for (const p of ps){
        p.vy += .35 * d; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        const dx = Math.cos(p.a) * p.l / 2, dy = Math.sin(p.a) * p.l / 2;
        cx.strokeStyle = p.c; cx.beginPath();
        cx.moveTo(p.x - dx, p.y - dy); cx.lineTo(p.x + dx, p.y + dy); cx.stroke();
      }
      if (++t < 160) requestAnimationFrame(f); else cx.clearRect(0, 0, W, H);
    })();
  }
})();
</script>
